<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Workspace</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --link: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --link: #93c5fd; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; }
  main { max-width: 38rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.6rem; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--link); }
  footer { color: var(--muted); font-size: 0.9rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  <h1>Claude Code Workspace</h1>
  <p>A personal tool. It lets its owner's own scripts read and edit the owner's own Google Docs, Sheets and Drive files.</p>
  <p>It isn't offered to anyone else.</p>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
